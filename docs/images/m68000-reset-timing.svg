<text x="42" y="971" font-size="15" text-anchor="start" font-weight="normal" style="fill:#172b43">* DTACK is measured at the FPGA responder output, not at the CPU pin. Data is shown only after ACK.</text>
<text x="42" y="995" font-size="15" text-anchor="start" font-weight="normal" style="fill:#172b43">Digital capture after level translation; not an analog timing signoff or proof of an fx68k defect.</text>
