<text x="42" y="48" font-size="29" text-anchor="start" font-weight="bold" style="fill:#172b43">One extra 5 MHz clock per reset-vector read</text>
<text x="42" y="79" font-size="18" text-anchor="start" font-weight="normal" style="fill:#172b43">Actual FPGA-sampled signals · fx68k versus socketed MC68000P12 · 20 ns resolution</text>
<text x="42" y="106" font-size="17" text-anchor="start" font-weight="normal" style="fill:#172b43">3 / 3 repeated runs match · identical program and memory · wait_ticks = 8</text>
<text x="42" y="133" font-size="16" text-anchor="start" font-weight="normal" style="fill:#172b43">Each panel is aligned to its own first AS falling edge; this removes reset-exit phase offset.</text>
