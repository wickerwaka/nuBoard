<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470">
  <title>BR asserted after the falling edge: fx68k grants one clock early</title>
  <desc>Measured at 20 ns resolution. Separate CPU runs aligned to the local falling edge. BR goes low at 40 ns. Original fx68k BG goes low at 300 ns, diagnostic extra-stage fx68k at 500 ns, and MC68000 BG is first observed low at 520 ns.</desc>
  <rect width="960" height="470" fill="#101820"/>
  <g font-family="sans-serif" fill="#edf2f7">
    <text x="25" y="32" font-size="20">BR after falling edge: one CPU clock early</text>
    <text x="25" y="57" font-size="13">MC68000P12 and fx68k • 5 MHz • 20 ns samples • runs aligned to each CPU's clock</text>
  </g>
  <g stroke="#364350" stroke-dasharray="4 5">
    <path d="M280 85V370 M360 85V370 M440 85V370 M520 85V370 M600 85V370 M680 85V370 M760 85V370 M840 85V370"/>
  </g>
  <g font-family="sans-serif" fill="#b8c5d1" font-size="12" text-anchor="middle">
    <text x="280" y="82">0 ns ↓</text><text x="360" y="82">100 ↑</text>
    <text x="440" y="82">200 ↓</text><text x="520" y="82">300 ↑</text>
    <text x="600" y="82">400 ↓</text><text x="680" y="82">500 ↑</text>
    <text x="760" y="82">600 ↓</text><text x="840" y="82">700 ↑</text>
  </g>
  <g font-family="sans-serif" fill="#edf2f7" font-size="14">
    <text x="25" y="119">CPU clock</text>
    <text x="25" y="179">BR_N (both CPUs)</text>
    <text x="25" y="239">BG_N • original fx68k</text>
    <text x="25" y="299">BG_N • MC68000</text>
    <text x="25" y="359">BG_N • extra-stage fx68k</text>
  </g>
  <g fill="none" stroke-width="3" stroke-linejoin="round">
    <path stroke="#b8c5d1" d="M240 100H280V125H360V100H440V125H520V100H600V125H680V100H760V125H840V100H880"/>
    <path stroke="#63cddd" d="M240 160H312V185H880"/>
    <path stroke="#ffb454" d="M240 220H520V245H880"/>
    <path stroke="#a5d68b" d="M240 280H696V305H880"/>
    <path stroke="#bfa2f5" d="M240 340H680V365H880"/>
    <path stroke="#ffb454" stroke-width="1.5" d="M520 263H680 M520 257V269 M680 257V269"/>
  </g>
  <g font-family="sans-serif" font-size="12">
    <text x="322" y="153" fill="#63cddd">+40 ns: safely after falling edge</text>
    <text x="590" y="257" fill="#ffb454">200 ns</text>
    <text x="707" y="294" fill="#a5d68b">+520 ns observed</text>
    <text x="692" y="355" fill="#bfa2f5">+500 ns</text>
    <text x="25" y="407" fill="#edf2f7">Before-edge control (BR at −40 ns): fx68k +300 ns; MC68000 +320 ns; extra stage +300 ns.</text>
    <text x="25" y="432" fill="#b8c5d1">Physical BG appears one sample after its launch edge; that residual is not another CPU cycle.</text>
    <text x="25" y="452" fill="#b8c5d1">Source: board-controls/s0-d067-r000.json and s1-d067-r000.json. BGACK held high; AS idle.</text>
  </g>
</svg>
